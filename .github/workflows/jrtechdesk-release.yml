name: JrTechDesk Release

# Publica uma versão do JrTechDesk no GitHub Releases, em duas etapas:
#
#   1. preparar: junta os arquivos de quatro builds já concluídas (Windows completo/suporte,
#      Linux completo/suporte, todas do mesmo commit da main, com a mesma versao-jr e, no
#      Windows, com os testes Rust rodados) numa release em RASCUNHO. Grava junto o
#      PROVENIENCIA.json: commit, builds e SHA-256 de cada arquivo aprovado.
#   2. publicar: só a partir da main e no ambiente "release". Reconfere as quatro builds
#      indicadas no PROVENIENCIA.json (workflow, commit, conclusão, testes), baixa os
#      artefatos delas no Actions e exige que o rascunho tenha exatamente esses bytes;
#      faz checkout do commit das builds, gera e assina o jrtechdesk-update.json (completo)
#      e o jrtechdesk-suporte-update.json (suporte), reconfere tudo pelo ID da release e
#      publica. Se parar no meio, pode rodar de novo: o que já foi assinado é conferido.
#      Os .exe não podem ser trocados à mão no rascunho; a assinatura Authenticode, quando
#      houver certificado, entra na build.
#
# Os nomes dos arquivos são fixos, então estes links sempre levam à última versão:
#   https://github.com/rxyslan/jrtechdesk/releases/latest/download/JrTechDesk-suporte.exe
#   https://github.com/rxyslan/jrtechdesk/releases/latest/download/JrTechDesk-completo.exe

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "preparar = monta o rascunho; publicar = assina a atualização e publica"
        type: choice
        options: [preparar, publicar]
        default: preparar
      versao-jr:
        description: "Número da versão JrTechDesk (o mesmo usado nas builds)"
        type: string
        required: true
      run-windows-completo:
        description: "preparar: ID da build Windows completo"
        type: string
        default: ""
      run-windows-suporte:
        description: "preparar: ID da build Windows suporte"
        type: string
        default: ""
      run-linux-completo:
        description: "preparar: ID da build Linux completo"
        type: string
        default: ""
      run-linux-suporte:
        description: "preparar: ID da build Linux suporte"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: jrtechdesk-release
  cancel-in-progress: false

env:
  # Os seis pacotes de toda release, pelo nome exato.
  PACOTES: >-
    JrTechDesk-completo.exe JrTechDesk-suporte.exe
    jrtechdesk-completo.deb jrtechdesk-suporte.deb
    jrtechdesk-completo.pkg.tar.zst jrtechdesk-suporte.pkg.tar.zst

jobs:
  preparar:
    if: inputs.etapa == 'preparar'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO_JR: ${{ inputs.versao-jr }}
      RUN_WIN_COMPLETO: ${{ inputs.run-windows-completo }}
      RUN_WIN_SUPORTE: ${{ inputs.run-windows-suporte }}
      RUN_LINUX_COMPLETO: ${{ inputs.run-linux-completo }}
      RUN_LINUX_SUPORTE: ${{ inputs.run-linux-suporte }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Versão
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSAO_JR" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::versao-jr precisa ser 1 ou mais"; exit 1; }
          base="$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p;T;q' Cargo.toml)"
          [ -n "$base" ] || { echo "::error::versão não encontrada no Cargo.toml"; exit 1; }
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "VERSAO=${base}-jr${VERSAO_JR}" >> "$GITHUB_ENV"
          echo "TAG=v${base}-jr${VERSAO_JR}" >> "$GITHUB_ENV"
          echo "Versão: ${base}-jr${VERSAO_JR}"

      - name: Conferir as builds
        shell: bash
        run: |
          set -euo pipefail
          check_run() { # id workflow padrão-do-log exige-testes; imprime o commit da build
            local id="$1" wf="$2" pattern="$3" testes="$4" info
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::ID de build inválido: '$id'" >&2; return 1; }
            info="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            [ "$(jq -r .name <<<"$info")" = "$wf" ] || { echo "::error::build $id não é do workflow '$wf'" >&2; return 1; }
            [ "$(jq -r .conclusion <<<"$info")" = "success" ] || { echo "::error::build $id não terminou com sucesso" >&2; return 1; }
            # A versao-jr fica no log de cada build; confere que é a mesma desta release.
            gh run view "$id" -R "$GITHUB_REPOSITORY" --log > "log-$id.txt"
            grep -Eq "$pattern" "log-$id.txt" \
              || { echo "::error::build $id não foi feita com versao-jr=$VERSAO_JR" >&2; return 1; }
            if [ "$testes" = sim ]; then
              # A build do Windows pode pular os testes (run-tests=false); a release não aceita.
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --paginate \
                --jq '.jobs[].steps[] | select(.name == "Run the Rust tests") | .conclusion' > "testes-$id.txt"
              if ! grep -qx success "testes-$id.txt" || grep -qvx success "testes-$id.txt"; then
                echo "::error::build $id não rodou os testes Rust com sucesso" >&2; return 1
              fi
            fi
            jq -r .head_sha <<<"$info"
          }
          s1="$(check_run "$RUN_WIN_COMPLETO" "JrTechDesk Windows x64" "JRTECH_RELEASE: ${VERSAO_JR}\b" sim)"
          s2="$(check_run "$RUN_WIN_SUPORTE" "JrTechDesk Windows x64" "JRTECH_RELEASE: ${VERSAO_JR}\b" sim)"
          s3="$(check_run "$RUN_LINUX_COMPLETO" "JrTechDesk Linux x86_64" "JRTECH_RELEASE=${VERSAO_JR}\b" nao)"
          s4="$(check_run "$RUN_LINUX_SUPORTE" "JrTechDesk Linux x86_64" "JRTECH_RELEASE=${VERSAO_JR}\b" nao)"
          if [ "$s1" != "$s2" ] || [ "$s1" != "$s3" ] || [ "$s1" != "$s4" ]; then
            echo "::error::as quatro builds precisam ser do mesmo commit ($s1 $s2 $s3 $s4)"; exit 1
          fi
          [[ "$s1" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit inválido: $s1"; exit 1; }
          echo "COMMIT=$s1" >> "$GITHUB_ENV"
          # Só sai release de commit que já está na main (revisado por PR).
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${s1}" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::o commit $s1 das builds não está na main ($status)"; exit 1 ;;
          esac
          # A tag sai do Cargo.toml deste ref; precisa ser a mesma versão compilada nas builds,
          # senão o app instalado veria a release sempre como mais nova e reinstalaria sem parar.
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${GITHUB_REPOSITORY}/contents/Cargo.toml?ref=${s1}" > Cargo-builds.toml
          base_commit="$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p;T;q' Cargo-builds.toml)"
          if [ "$base_commit" != "$BASE" ]; then
            echo "::error::as builds são da versão '$base_commit', mas este ref está em '$BASE'; rode a release a partir do commit das builds"; exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release $TAG já existe; use outro número de versão"; exit 1
          fi
          # Uma tag que já exista com esse nome precisa apontar para o commit das builds.
          if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)"; then
            alvo="$(jq -r .object.sha <<<"$ref")"
            if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
              alvo="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${alvo}" --jq .object.sha)"
            fi
            [ "$alvo" = "$s1" ] || { echo "::error::a tag $TAG já existe e aponta para $alvo, não para $s1"; exit 1; }
          fi

      - name: Baixar os arquivos das builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl out
          get() { # id padrão-do-artefato destino
            rm -rf dl/*
            gh run download "$1" -R "$GITHUB_REPOSITORY" -p "$2" -D dl
            local files
            mapfile -t files < <(find dl -type f -name "$3")
            [ "${#files[@]}" -eq 1 ] || { echo "::error::esperava 1 arquivo $3 na build $1, achei ${#files[@]}"; exit 1; }
            cp "${files[0]}" "out/$4"
          }
          get "$RUN_WIN_COMPLETO"   'jrtechdesk-installer-x86_64-completo-*' '*.exe'     JrTechDesk-completo.exe
          get "$RUN_WIN_SUPORTE"    'jrtechdesk-installer-x86_64-suporte-*'  '*.exe'     JrTechDesk-suporte.exe
          get "$RUN_LINUX_COMPLETO" 'jrtechdesk-deb-x86_64-completo-*'       '*.deb'     jrtechdesk-completo.deb
          get "$RUN_LINUX_SUPORTE"  'jrtechdesk-deb-x86_64-suporte-*'        '*.deb'     jrtechdesk-suporte.deb
          get "$RUN_LINUX_COMPLETO" 'jrtechdesk-archlinux-x86_64-completo-*' '*.pkg.tar.zst' jrtechdesk-completo.pkg.tar.zst
          get "$RUN_LINUX_SUPORTE"  'jrtechdesk-archlinux-x86_64-suporte-*'  '*.pkg.tar.zst' jrtechdesk-suporte.pkg.tar.zst
          cd out
          read -ra pacotes <<<"$PACOTES"
          sha256sum -- "${pacotes[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # O que a etapa publicar vai exigir: este commit e exatamente estes arquivos.
          arquivos='{}'
          for nome in "${pacotes[@]}"; do
            arquivos="$(jq --arg n "$nome" --arg h "$(sha256sum "$nome" | cut -d' ' -f1)" '. + {($n): $h}' <<<"$arquivos")"
          done
          jq -n --arg tag "$TAG" --arg versao "$VERSAO" --arg commit "$COMMIT" \
            --arg wc "$RUN_WIN_COMPLETO" --arg ws "$RUN_WIN_SUPORTE" \
            --arg lc "$RUN_LINUX_COMPLETO" --arg ls "$RUN_LINUX_SUPORTE" --argjson a "$arquivos" \
            '{tag: $tag, versao: $versao, commit: $commit,
              builds: {windows_completo: $wc, windows_suporte: $ws, linux_completo: $lc, linux_suporte: $ls},
              arquivos: $a}' > PROVENIENCIA.json
          cat PROVENIENCIA.json

      - name: Criar o rascunho da release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          JrTechDesk ${VERSAO} (commit ${COMMIT}).

          | Arquivo | Para quem |
          |---|---|
          | \`JrTechDesk-suporte.exe\` | Cliente no Windows: abre direto, sem instalar |
          | \`JrTechDesk-completo.exe\` | Técnico no Windows: instala; avisa quando há versão nova e o técnico decide quando atualizar |
          | \`jrtechdesk-completo.deb\` / \`.pkg.tar.zst\` | Técnico no Linux (Debian/Ubuntu, Arch) |
          | \`jrtechdesk-suporte.deb\` / \`.pkg.tar.zst\` | Cliente no Linux |

          \`PROVENIENCIA.json\` registra o commit, as builds e o SHA-256 de cada arquivo.
          Código-fonte (AGPL-3.0): este repositório, no commit acima.
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$COMMIT" \
            --title "JrTechDesk ${VERSAO}" --notes-file notes.md out/*
          echo "Rascunho criado. Rode a etapa 'publicar' a partir da main." >> "$GITHUB_STEP_SUMMARY"

  # Disparar "publicar" de outra branch não pode passar em silêncio como job pulado.
  recusar-publicar-fora-da-main:
    if: inputs.etapa == 'publicar' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo "::error::a etapa publicar só roda a partir da main (este disparo veio de ${GITHUB_REF})"
          exit 1

  publicar:
    if: inputs.etapa == 'publicar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    # O segredo de assinatura deve ficar SÓ neste ambiente (não no repositório), com revisor
    # obrigatório e política de branch restrita à main. Ver o README.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO_JR: ${{ inputs.versao-jr }}
    steps:
      - name: Achar o rascunho
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSAO_JR" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::versao-jr precisa ser 1 ou mais"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and (.tag_name | test(\"^v[0-9]+\\\\.[0-9]+\\\\.[0-9]+-jr${VERSAO_JR}\$\"))) | [.id, .tag_name, .target_commitish] | @tsv" \
            > rascunhos.tsv
          [ "$(wc -l < rascunhos.tsv)" -eq 1 ] \
            || { echo "::error::esperava 1 rascunho com versao-jr=$VERSAO_JR, achei $(wc -l < rascunhos.tsv)"; cat rascunhos.tsv; exit 1; }
          IFS=$'\t' read -r id tag alvo < rascunhos.tsv
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::ID de release inválido: $id"; exit 1; }
          # Daqui em diante o rascunho é sempre lido pelo ID, não pelo nome da tag.
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSAO=${tag#v}" >> "$GITHUB_ENV"
          echo "ALVO=$alvo" >> "$GITHUB_ENV"

      # O PROVENIENCIA.json do rascunho só diz QUAIS builds conferir: a verdade vem dos
      # artefatos dessas builds no Actions, que ninguém edita depois de a build terminar.
      - name: Reconferir as builds e baixar os artefatos aprovados
        shell: bash
        run: |
          set -euo pipefail
          baixar_asset() { # nome destino
            local url
            url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq ".assets[] | select(.name == \"$1\") | .url")"
            [ -n "$url" ] || { echo "::error::falta $1 no rascunho"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "$url" > "$2"
          }
          mkdir -p prov aprovados dl
          baixar_asset PROVENIENCIA.json prov/PROVENIENCIA.json
          commit="$(jq -er .commit prov/PROVENIENCIA.json)"
          [ "$(jq -er .tag prov/PROVENIENCIA.json)" = "$TAG" ] || { echo "::error::PROVENIENCIA.json é de outra tag"; exit 1; }
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit inválido no PROVENIENCIA.json"; exit 1; }
          [ "$ALVO" = "$commit" ] || { echo "::error::o rascunho aponta para $ALVO, mas as builds são de $commit"; exit 1; }
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${commit}" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::o commit $commit não está na main ($status)"; exit 1 ;;
          esac
          conferir_build() { # id arquivo-do-workflow padrão-do-log exige-testes
            local id="$1" wf="$2" pattern="$3" testes="$4" info
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::ID de build inválido: '$id'"; exit 1; }
            info="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            [ "$(jq -r .path <<<"$info")" = "$wf" ] || { echo "::error::build $id não é de $wf"; exit 1; }
            [ "$(jq -r .conclusion <<<"$info")" = success ] || { echo "::error::build $id não terminou com sucesso"; exit 1; }
            [ "$(jq -r .head_sha <<<"$info")" = "$commit" ] || { echo "::error::build $id não é do commit $commit"; exit 1; }
            gh run view "$id" -R "$GITHUB_REPOSITORY" --log > "log-$id.txt"
            grep -Eq "$pattern" "log-$id.txt" || { echo "::error::build $id não foi feita com versao-jr=$VERSAO_JR"; exit 1; }
            if [ "$testes" = sim ]; then
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --paginate \
                --jq '.jobs[].steps[] | select(.name == "Run the Rust tests") | .conclusion' > "testes-$id.txt"
              if ! grep -qx success "testes-$id.txt" || grep -qvx success "testes-$id.txt"; then
                echo "::error::build $id não rodou os testes Rust com sucesso"; exit 1
              fi
            fi
          }
          get() { # id padrão-do-artefato padrão-do-arquivo destino
            rm -rf dl/*
            gh run download "$1" -R "$GITHUB_REPOSITORY" -p "$2" -D dl
            local files
            mapfile -t files < <(find dl -type f -name "$3")
            [ "${#files[@]}" -eq 1 ] || { echo "::error::esperava 1 arquivo $3 na build $1, achei ${#files[@]}"; exit 1; }
            cp "${files[0]}" "aprovados/$4"
          }
          wc_id="$(jq -er .builds.windows_completo prov/PROVENIENCIA.json)"
          ws_id="$(jq -er .builds.windows_suporte prov/PROVENIENCIA.json)"
          lc_id="$(jq -er .builds.linux_completo prov/PROVENIENCIA.json)"
          ls_id="$(jq -er .builds.linux_suporte prov/PROVENIENCIA.json)"
          conferir_build "$wc_id" .github/workflows/jrtechdesk-windows.yml "JRTECH_RELEASE: ${VERSAO_JR}\b" sim
          conferir_build "$ws_id" .github/workflows/jrtechdesk-windows.yml "JRTECH_RELEASE: ${VERSAO_JR}\b" sim
          conferir_build "$lc_id" .github/workflows/jrtechdesk-linux.yml "JRTECH_RELEASE=${VERSAO_JR}\b" nao
          conferir_build "$ls_id" .github/workflows/jrtechdesk-linux.yml "JRTECH_RELEASE=${VERSAO_JR}\b" nao
          get "$wc_id" 'jrtechdesk-installer-x86_64-completo-*' '*.exe'          JrTechDesk-completo.exe
          get "$ws_id" 'jrtechdesk-installer-x86_64-suporte-*'  '*.exe'          JrTechDesk-suporte.exe
          get "$lc_id" 'jrtechdesk-deb-x86_64-completo-*'       '*.deb'          jrtechdesk-completo.deb
          get "$ls_id" 'jrtechdesk-deb-x86_64-suporte-*'        '*.deb'          jrtechdesk-suporte.deb
          get "$lc_id" 'jrtechdesk-archlinux-x86_64-completo-*' '*.pkg.tar.zst'  jrtechdesk-completo.pkg.tar.zst
          get "$ls_id" 'jrtechdesk-archlinux-x86_64-suporte-*'  '*.pkg.tar.zst'  jrtechdesk-suporte.pkg.tar.zst
          echo "COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Conferir o rascunho contra os artefatos aprovados
        shell: bash
        run: |
          set -euo pipefail
          read -ra pacotes <<<"$PACOTES"
          extras=(SHA256SUMS.txt PROVENIENCIA.json
            jrtechdesk-update.json jrtechdesk-update.json.sig
            jrtechdesk-suporte-update.json jrtechdesk-suporte-update.json.sig)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          [ "$(jq -r .draft release.json)" = true ] || { echo "::error::a release $RELEASE_ID não é mais rascunho"; exit 1; }
          jq -r '.assets[].name' release.json | sort > nomes.txt
          printf '%s\n' "${pacotes[@]}" "${extras[@]}" | sort > permitidos.txt
          inesperados="$(comm -23 nomes.txt permitidos.txt)"
          [ -z "$inesperados" ] || { echo "::error::arquivos inesperados no rascunho: $inesperados"; exit 1; }
          # Cada pacote do rascunho precisa ser byte a byte o artefato aprovado. Um .exe
          # assinado com Authenticode entra pelo fluxo de assinatura na build (PR do
          # certificado), nunca trocado à mão no rascunho.
          for nome in "${pacotes[@]}"; do
            esperado="$(sha256sum "aprovados/$nome" | cut -d' ' -f1)"
            digest="$(jq -r --arg n "$nome" '.assets[] | select(.name == $n) | .digest // ""' release.json)"
            [ "$digest" = "sha256:$esperado" ] \
              || { echo "::error::$nome no rascunho ($digest) não é o artefato da build (sha256:$esperado)"; exit 1; }
          done
          mkdir -p out
          cp aprovados/* out/
          # Manifestos já assinados numa tentativa anterior: baixados para conferir. Metade de
          # um par (json sem sig ou o contrário) é apagada e o par é refeito.
          for base in jrtechdesk-update.json jrtechdesk-suporte-update.json; do
            tem_json="$(grep -cxF "$base" nomes.txt || true)"
            tem_sig="$(grep -cxF "$base.sig" nomes.txt || true)"
            if [ "$tem_json" = 1 ] && [ "$tem_sig" = 1 ]; then
              for nome in "$base" "$base.sig"; do
                url="$(jq -r --arg n "$nome" '.assets[] | select(.name == $n) | .url' release.json)"
                gh api -H 'Accept: application/octet-stream' "$url" > "out/$nome"
              done
            elif [ "$tem_json" = 1 ] || [ "$tem_sig" = 1 ]; then
              for nome in "$base" "$base.sig"; do
                asset="$(jq -r --arg n "$nome" '.assets[] | select(.name == $n) | .id' release.json)"
                if [ -n "$asset" ]; then
                  echo "::warning::apagando $nome (par incompleto) para assinar de novo"
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
                fi
              done
            fi
          done
          ls -la out

      - name: Checkout do commit das builds
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.COMMIT }}
          path: src
          persist-credentials: false

      - name: Conferir a versão do commit
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git -C src rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::checkout não está em $COMMIT"; exit 1; }
          base="$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p;T;q' src/Cargo.toml)"
          [ "v${base}-jr${VERSAO_JR}" = "$TAG" ] || { echo "::error::o commit está na versão $base, não em $TAG"; exit 1; }

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r src/res/update/update_metadata_requirements.txt'

      - name: Conferir a chave de assinatura
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.JRTECH_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.JRTECH_UPDATE_ED25519_PUBLIC_KEY }}
        run: python src/res/update/generate_update_metadata.py check-key --rust-source src/src/update_metadata.rs

      - name: Assinar o arquivo de atualização
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.JRTECH_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.JRTECH_UPDATE_ED25519_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gerador=src/res/update/generate_update_metadata.py
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          # Um arquivo por modo, com package_id próprio: o completo instalado só aceita o
          # completo, e o suporte portátil só aceita o suporte. Numa nova tentativa, o par
          # que já foi assinado é conferido em vez de assinado de novo.
          assinar() { # package-id exe metadata
            if [ -f "./out/$3" ] && [ -f "./out/$3.sig" ]; then
              echo "$3 já existe no rascunho; conferindo"
            else
              python "$gerador" sign \
                --artifact windows x86_64 exe "./out/$2" \
                --version "$VERSAO" --release-id "$TAG" \
                --package-id "$1" \
                --release-base-url "$base_url" \
                --published-at "$PUBLISHED_AT" \
                --metadata-out "./out/$3" \
                --signature-out "./out/$3.sig"
            fi
            python "$gerador" verify \
              --metadata "./out/$3" \
              --signature "./out/$3.sig" \
              --artifact "./out/$2" \
              --version "$VERSAO" --release-id "$TAG" \
              --package-id "$1" \
              --release-base-url "$base_url"
            cat "./out/$3"; echo
          }
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          assinar jrtechdesk JrTechDesk-completo.exe jrtechdesk-update.json
          assinar jrtechdesk-suporte JrTechDesk-suporte.exe jrtechdesk-suporte-update.json

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          read -ra pacotes <<<"$PACOTES"
          (cd out && sha256sum -- "${pacotes[@]}" > SHA256SUMS.txt)
          finais=(jrtechdesk-update.json jrtechdesk-update.json.sig
            jrtechdesk-suporte-update.json jrtechdesk-suporte-update.json.sig SHA256SUMS.txt)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${finais[@]/#/out/}"
          # Reconfere, pelo ID, tudo o que vai ficar público, logo antes de publicar.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          [ "$(jq -r .draft release.json)" = true ] || { echo "::error::a release $RELEASE_ID não é mais rascunho"; exit 1; }
          [ "$(jq -r .tag_name release.json)" = "$TAG" ] || { echo "::error::a tag do rascunho mudou"; exit 1; }
          [ "$(jq -r .target_commitish release.json)" = "$COMMIT" ] || { echo "::error::o alvo do rascunho mudou"; exit 1; }
          for nome in "${pacotes[@]}" "${finais[@]}"; do
            esperado="sha256:$(sha256sum "out/$nome" | cut -d' ' -f1)"
            digest="$(jq -r --arg n "$nome" '[.assets[] | select(.name == $n)] | if length == 1 then .[0].digest // "" else "" end' release.json)"
            [ "$digest" = "$esperado" ] || { echo "::error::$nome no rascunho ($digest) difere do conferido ($esperado)"; exit 1; }
          done
          # Uma tag que já exista precisa apontar para o commit das builds. 404 = ainda não
          # existe (a publicação cria no alvo conferido); qualquer outro erro para tudo.
          if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>erro.txt)"; then
            alvo="$(jq -r .object.sha <<<"$ref")"
            if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
              alvo="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${alvo}" --jq .object.sha)"
            fi
            [ "$alvo" = "$COMMIT" ] || { echo "::error::a tag $TAG aponta para $alvo, não para $COMMIT"; exit 1; }
          elif ! grep -q 'HTTP 404' erro.txt; then
            echo "::error::não deu para conferir a tag $TAG"; cat erro.txt; exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=true > /dev/null
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          alvo="$(jq -r .object.sha <<<"$ref")"
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            alvo="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${alvo}" --jq .object.sha)"
          fi
          [ "$alvo" = "$COMMIT" ] || { echo "::error::publicada, mas a tag $TAG aponta para $alvo e não para $COMMIT; verifique já"; exit 1; }
          echo "Publicada: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
